<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" id="meta-theme">
<title>Training FR · Tus rutinas de gimnasio</title>
<meta name="description" content="Crea rutinas de gimnasio, aprende la técnica correcta con animaciones y registra tu progreso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="splash" class="splash">
  <img class="splash-logo" src="icons/logo.svg" alt="Training FR" width="150" height="108">
  <div class="splash-name">TRAINING <b>FR</b></div>
  <div class="spinner"></div>
  <div id="splash-msg" class="splash-msg">Cargando catálogo de ejercicios…</div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" data-nav="inicio" aria-label="Ir al inicio">
      <img class="brand-logo" src="icons/logo.svg" alt="" width="34" height="24">
      <span>TRAINING <b>FR</b></span>
    </button>
    <div id="topbar-actions" class="topbar-actions"></div>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-nav="inicio">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Inicio</span>
  </button>
  <button class="tab" data-nav="ejercicios">
    <svg viewBox="0 0 24 24"><path d="M4 8v8M8 6v12M16 6v12M20 8v8M8 12h8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
    <span>Ejercicios</span>
  </button>
  <button class="tab" data-nav="rutinas">
    <svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v15l-4-2-4 2-4-2-4 2V5a1 1 0 0 1 1-1z"/></svg>
    <span>Rutinas</span>
  </button>
  <button class="tab" data-nav="progreso">
    <svg viewBox="0 0 24 24"><path d="M4 19h16M6 16V9M11 16V5M16 16v-4M21 16v-7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <span>Progreso</span>
  </button>
  <button class="tab" data-nav="ajustes">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2l1.3 2.6 2.9-.5.6 2.9 2.6 1.3-1.6 2.5 1.6 2.5-2.6 1.3-.6 2.9-2.9-.5L12 22l-1.3-2.6-2.9.5-.6-2.9-2.6-1.3L6.2 13 4.6 10.5 7.2 9.2l.6-2.9 2.9.5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    <span>Ajustes</span>
  </button>
</nav>

<div id="rest-host"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" hidden></div>

<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/data.js"></script>
<script src="js/templates.js"></script>
<script src="js/planner.js"></script>
<script src="js/offline.js"></script>
<script src="js/sync.js"></script>
<script src="js/workout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
