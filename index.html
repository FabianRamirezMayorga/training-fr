<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" id="meta-theme">
<title>Training FR · Tus rutinas de gimnasio</title>
<meta name="description" content="Crea rutinas de gimnasio, aprende la técnica correcta con animaciones y registra tu progreso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<!-- Safari no admite SVG aquí: sin un PNG, al añadirla a la pantalla de
     inicio el icono acaba siendo una captura de la página. 180×180 es el
     tamaño que pide iOS, y opaco porque compone lo transparente sobre negro. -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<!-- iOS lee el manifest desde la 17, pero los iPhone que no han actualizado
     siguen necesitando esto para arrancar a pantalla completa. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training FR">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="splash" class="splash">
  <img class="splash-logo" src="icons/logo.svg" alt="Training FR" width="86" height="109">
  <div class="splash-name wordmark">TRAINING<sup>FR</sup></div>
  <div class="spinner"></div>
  <div id="splash-msg" class="splash-msg"><span data-t="Cargando catálogo de ejercicios…">Cargando catálogo de ejercicios…</span></div>
</div>

<header class="topbar">
  <div class="topbar-inner">

  </div>
</header>

<div id="avisos" class="avisos"></div>
<main id="view" class="view" aria-live="polite"></main>

<nav class="tabbar" id="tabbar">

    <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span data-t="Inicio">Inicio</span>
  </button>
  <button class="tab" data-nav="ejercicios">
    <svg viewBox="0 0 24 24"><path d="M4 8v8M8 6v12M16 6v12M20 8v8M8 12h8" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
    <span data-t="Ejercicios">Ejercicios</span>
  </button>
  <button class="tab" data-nav="rutinas">
    <svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v15l-4-2-4 2-4-2-4 2V5a1 1 0 0 1 1-1z"/></svg>
    <span data-t="Rutinas">Rutinas</span>
  </button>
  <button class="tab" data-nav="progreso">
    <svg viewBox="0 0 24 24"><path d="M4 19h16M6 16V9M11 16V5M16 16v-4M21 16v-7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <span data-t="Progreso">Progreso</span>
  </button>
  <button class="tab" data-nav="perfil">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20v-.6A5.4 5.4 0 0110.4 14h3.2A5.4 5.4 0 0119 19.4v.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span data-t="Perfil">Perfil</span>
  </button>
</nav>
